replicaCount: 1
image:
  repository: azlich/python-app
  pullPolicy: IfNotPresent
  tag: v1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
podLabels: {}

serviceAccount:
  create: false # set to false to make sure we don't create a service account
  automount: true
  annotations: {}
  name: ""

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 5000 # set to container port

ingress:
  enabled: true # set to true
  className: "nginx" # set to nginx
  annotations: {}
  hosts:
    - host: python-app.test.com # set to custom dns
      paths:
        - path: /
          pathType: Prefix # change from ImplementationSpecific to Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
  - name: gateway
    sectionName: http
  hostnames:
  - chart-example.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers

resources: {}

livenessProbe:
  httpGet:
    path: /api/v1/healthz # set to healthz api
    port: http
readinessProbe:
  httpGet:
    path: /api/v1/healthz # set to healthz api
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
